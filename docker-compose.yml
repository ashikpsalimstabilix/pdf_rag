# Start everything:   docker compose up --build
#   Chat UI -> http://localhost:8501
#   API     -> http://localhost:8000/docs
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env                     # your API keys
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000  # inside Docker, services find each other by name
    ports:
      - "8501:8501"
    depends_on:
      - backend
